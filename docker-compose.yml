# DressSense - triển khai trọn gói bằng Docker
#   mysql        : CSDL MySQL 8
#   ai-service   : Python/FastAPI (phân tích dáng người)
#   api          : Node/Express/Prisma (REST API)
#   web          : React build + Nginx (phục vụ SPA + reverse-proxy /api, /uploads)
#   ngrok        : công khai ra Internet qua tên miền cố định (profile "tunnel")
#
# Chạy app (không ngrok):   docker compose up -d --build
# Chạy kèm ngrok:           docker compose --profile tunnel up -d --build

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dresssense}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-dresssense}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      JWT_REMEMBER_EXPIRES_IN: 30d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SEED_ON_START: ${SEED_ON_START:-false}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_URL: ${VNP_URL:-https://sandbox.vnpayment.vn/paymentv2/vnpaymenthtml}
      VNP_RETURN_URL: ${PUBLIC_URL:-http://localhost:8080}/api/payments/vnpay/return
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Công khai ra Internet qua tên miền cố định (chỉ chạy khi bật profile "tunnel")
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    command: http --domain=${NGROK_DOMAIN} web:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # bảng điều khiển ngrok (http://localhost:4040)
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
