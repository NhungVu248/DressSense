# Nginx phục vụ SPA React + reverse-proxy API/uploads sang backend (cùng origin).
# Public qua ngrok -> HTTPS được bảo đảm ở biên ngrok; nội bộ chạy HTTP.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cho phép upload ảnh (avatar, ảnh đánh giá, bằng chứng đổi/trả)
  client_max_body_size 12m;

  # API -> backend Express
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ảnh tải lên (multer) -> backend
  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: mọi đường dẫn còn lại trả index.html để React Router xử lý
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache tài nguyên tĩnh có hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
